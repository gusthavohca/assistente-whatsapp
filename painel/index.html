<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Club - Painel Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }

    /* LOGIN */
    #tela-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 40px; width: 100%; max-width: 360px; }
    .login-box h1 { text-align: center; font-size: 22px; margin-bottom: 8px; letter-spacing: 2px; }
    .login-box p { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
    .login-box input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 12px; }
    .login-box button { width: 100%; padding: 12px; background: #c9a84c; border: none; border-radius: 8px; color: #000; font-size: 15px; font-weight: bold; cursor: pointer; }
    .login-box button:hover { background: #e0bc6a; }
    .erro-login { color: #ff4444; font-size: 13px; text-align: center; margin-top: 10px; display: none; }

    /* PAINEL */
    #tela-painel { display: none; }
    header { background: #1a1a1a; border-bottom: 1px solid #333; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; letter-spacing: 2px; color: #c9a84c; }
    header button { background: none; border: 1px solid #555; color: #aaa; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

    /* ABAS */
    .abas { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .aba { padding: 10px 20px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #aaa; cursor: pointer; font-size: 14px; }
    .aba.ativa { background: #c9a84c; color: #000; border-color: #c9a84c; font-weight: bold; }

    /* SEÇÕES */
    .secao { display: none; }
    .secao.ativa { display: block; }

    .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: #c9a84c; }
    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    .campo input, .campo textarea { width: 100%; padding: 10px 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; }
    .campo textarea { resize: vertical; min-height: 120px; font-family: Arial, sans-serif; }
    .campo input:focus, .campo textarea:focus { outline: none; border-color: #c9a84c; }

    .btn-salvar { background: #c9a84c; color: #000; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-salvar:hover { background: #e0bc6a; }
    .btn-salvar:disabled { background: #555; color: #888; cursor: not-allowed; }

    .status { font-size: 13px; margin-top: 10px; height: 18px; }
    .status.ok { color: #44cc88; }
    .status.erro { color: #ff4444; }

    .cerebro-textarea { min-height: 400px !important; font-family: monospace !important; font-size: 13px !important; line-height: 1.5; }

    @media (max-width: 600px) {
      .card { padding: 16px; }
      header { padding: 12px 16px; }
      header h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="tela-login">
  <div class="login-box">
    <h1>LE CLUB</h1>
    <p>Painel Administrativo</p>
    <input type="password" id="campo-senha" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter') fazerLogin()">
    <button onclick="fazerLogin()">Entrar</button>
    <div class="erro-login" id="erro-login">Senha incorreta</div>
  </div>
</div>

<!-- TELA DO PAINEL -->
<div id="tela-painel">
  <header>
    <h1>LE CLUB — Admin</h1>
    <button onclick="sair()">Sair</button>
  </header>

  <div class="container">
    <div class="abas">
      <div class="aba ativa" onclick="trocarAba('atracoes')">Atrações</div>
      <div class="aba" onclick="trocarAba('cerebro')">Cérebro</div>
    </div>

    <!-- SEÇÃO: ATRAÇÕES -->
    <div class="secao ativa" id="secao-atracoes">

      <div class="card">
        <h2>Sexta-feira</h2>
        <div class="campo">
          <label>DJ / Atração</label>
          <input type="text" id="sexta-dj" placeholder="Nome do DJ">
        </div>
        <div class="campo">
          <label>Horário de abertura</label>
          <input type="text" id="sexta-horario" placeholder="Ex: 23:00">
        </div>
        <div class="campo">
          <label>URL do Flyer (link da imagem)</label>
          <input type="text" id="sexta-flyer" placeholder="https://...">
        </div>
        <button class="btn-salvar" onclick="salvarAtracao('sexta')">Salvar Sexta</button>
        <div class="status" id="status-sexta"></div>
      </div>

      <div class="card">
        <h2>Sábado</h2>
        <div class="campo">
          <label>DJ / Atração</label>
          <input type="text" id="sabado-dj" placeholder="Nome do DJ">
        </div>
        <div class="campo">
          <label>Horário de abertura</label>
          <input type="text" id="sabado-horario" placeholder="Ex: 23:00">
        </div>
        <div class="campo">
          <label>URL do Flyer (link da imagem)</label>
          <input type="text" id="sabado-flyer" placeholder="https://...">
        </div>
        <button class="btn-salvar" onclick="salvarAtracao('sabado')">Salvar Sábado</button>
        <div class="status" id="status-sabado"></div>
      </div>

    </div>

    <!-- SEÇÃO: CÉREBRO -->
    <div class="secao" id="secao-cerebro">
      <div class="card">
        <h2>Cérebro do Gusthavo</h2>
        <p style="color:#888; font-size:13px; margin-bottom:16px;">Edite o comportamento da IA. Salvar aqui atualiza o Gusthavo em tempo real.</p>
        <div class="campo">
          <textarea class="cerebro-textarea" id="campo-cerebro" placeholder="Carregando..."></textarea>
        </div>
        <button class="btn-salvar" onclick="salvarCerebro()">Salvar Cérebro</button>
        <div class="status" id="status-cerebro"></div>
      </div>
    </div>

  </div>
</div>

<script>
  const SENHA = 'leclub2025';

  function fazerLogin() {
    const senha = document.getElementById('campo-senha').value;
    if (senha === SENHA) {
      document.getElementById('tela-login').style.display = 'none';
      document.getElementById('tela-painel').style.display = 'block';
      carregarDados();
    } else {
      document.getElementById('erro-login').style.display = 'block';
    }
  }

  function sair() {
    document.getElementById('tela-login').style.display = 'flex';
    document.getElementById('tela-painel').style.display = 'none';
    document.getElementById('campo-senha').value = '';
  }

  function trocarAba(aba) {
    document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
    event.target.classList.add('ativa');
    document.getElementById('secao-' + aba).classList.add('ativa');
  }

  async function carregarDados() {
    try {
      const res = await fetch('/api/dados');
      const dados = await res.json();

      if (dados.atracoes) {
        if (dados.atracoes.sexta) {
          document.getElementById('sexta-dj').value = dados.atracoes.sexta.dj || '';
          document.getElementById('sexta-horario').value = dados.atracoes.sexta.horario || '';
          document.getElementById('sexta-flyer').value = dados.atracoes.sexta.urlFlyer || '';
        }
        if (dados.atracoes.sabado) {
          document.getElementById('sabado-dj').value = dados.atracoes.sabado.dj || '';
          document.getElementById('sabado-horario').value = dados.atracoes.sabado.horario || '';
          document.getElementById('sabado-flyer').value = dados.atracoes.sabado.urlFlyer || '';
        }
      }

      if (dados.cerebro) {
        document.getElementById('campo-cerebro').value = dados.cerebro;
      }
    } catch (e) {
      console.error('Erro ao carregar dados:', e);
    }
  }

  async function salvarAtracao(dia) {
    const btn = event.target;
    const status = document.getElementById('status-' + dia);
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    const dados = {
      dj: document.getElementById(dia + '-dj').value,
      horario: document.getElementById(dia + '-horario').value,
      urlFlyer: document.getElementById(dia + '-flyer').value,
    };

    try {
      const res = await fetch('/api/salvar-atracao', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dia, dados })
      });
      const resultado = await res.json();
      status.textContent = resultado.ok ? 'Salvo com sucesso!' : 'Erro ao salvar';
      status.className = 'status ' + (resultado.ok ? 'ok' : 'erro');
    } catch (e) {
      status.textContent = 'Erro de conexão';
      status.className = 'status erro';
    }

    btn.disabled = false;
    btn.textContent = 'Salvar ' + (dia === 'sexta' ? 'Sexta' : 'Sábado');
    setTimeout(() => { status.textContent = ''; }, 3000);
  }

  async function salvarCerebro() {
    const btn = event.target;
    const status = document.getElementById('status-cerebro');
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    const cerebro = document.getElementById('campo-cerebro').value;

    try {
      const res = await fetch('/api/salvar-cerebro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cerebro })
      });
      const resultado = await res.json();
      status.textContent = resultado.ok ? 'Cérebro atualizado!' : 'Erro ao salvar';
      status.className = 'status ' + (resultado.ok ? 'ok' : 'erro');
    } catch (e) {
      status.textContent = 'Erro de conexão';
      status.className = 'status erro';
    }

    btn.disabled = false;
    btn.textContent = 'Salvar Cérebro';
    setTimeout(() => { status.textContent = ''; }, 3000);
  }
</script>

</body>
</html>
