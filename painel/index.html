<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#185fa5">
<title>CBP — Le Club</title>
<link rel="manifest" href="/painel/manifest.json">
<link rel="icon" href="/painel/icons/icon-192.png">
<link rel="apple-touch-icon" href="/painel/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/painel/css/app.css">
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>CBP</h1>
    <p>Chico Bento Promoter · Le Club</p>
    <input type="password" id="senha" placeholder="Senha do painel" onkeydown="if(event.key==='Enter')fazerLogin()">
    <button class="btn" style="width:100%;margin-top:14px" onclick="fazerLogin()">Entrar</button>
    <p id="login-erro" style="color:var(--text-danger);margin-top:10px;display:none"></p>
  </div>
</div>

<div id="app" class="hide">
  <div class="scrim" id="scrim" onclick="fecharMenu()"></div>

  <aside class="side" id="side">
    <div class="brand"><b>LE CLUB</b><span>CBP · PROMOTER</span></div>
    <button class="nav on" data-tela="inicio" onclick="irPara('inicio')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Início</button>
    <button class="nav" data-tela="flyers" onclick="irPara('flyers')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Flyers</button>
    <button class="nav" data-tela="clientes" onclick="irPara('clientes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>Clientes</button>
    <button class="nav" data-tela="agenda" onclick="irPara('agenda')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agenda</button>
    <button class="nav" data-tela="links" onclick="irPara('links')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>Links</button>
    <button class="nav" data-tela="disparos" onclick="irPara('disparos')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>Disparos</button>
    <button class="nav" data-tela="perguntas" onclick="irPara('perguntas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/></svg>Perguntas</button>
    <div class="side-foot"><button class="nav" onclick="sair()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sair</button></div>
  </aside>

  <main class="main">
    <div class="top">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="burger" onclick="abrirMenu()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div><h1 id="titulo">Início</h1><div class="sub" id="subtitulo"></div></div>
      </div>
      <div class="top-actions">
        <button class="pill on" id="status" onclick="alternarCbp()"><i></i><span>carregando</span></button>
        <button class="bell" onclick="irPara('inicio')" aria-label="Pendências"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><b id="bell-n" class="hide">0</b></button>
      </div>
    </div>
    <div id="telas"></div>
  </main>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="/painel/js/api.js"></script>
<script src="/painel/js/ui.js"></script>
<script src="/painel/js/telas.js"></script>
<script src="/painel/js/telas2.js"></script>
<script src="/painel/js/app.js"></script>
</body>
</html>
